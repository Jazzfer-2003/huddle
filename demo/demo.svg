<svg xmlns="http://www.w3.org/2000/svg" width="890" height="480" viewBox="0 0 890 480" font-family="Consolas, Menlo, monospace">
  <rect width="890" height="480" rx="10" fill="#1e1e2e"/>
  <rect x="0" y="0" width="890" height="36" rx="10" fill="#181825"/>
  <rect x="0" y="26" width="890" height="10" fill="#181825"/>
  <circle cx="22" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="62" cy="18" r="6" fill="#a6e3a1"/>
  <text x="445" y="23" fill="#cdd6f4" font-size="13" text-anchor="middle">opencode — session (host) + roundtable</text>

  <!-- you -->
  <text x="24" y="70" fill="#cdd6f4" font-size="15">
    <tspan x="24" dy="0" fill="#89b4fa">you&gt;</tspan>
    <tspan xml:space="preserve"> @codex what does add(2,3) in calc.ts return? Just the value.</tspan>
  </text>

  <!-- host routes -->
  <text x="24" y="106" fill="#6c7086" font-size="14">⚙ roundtable rt.ask {"agent":"codex", "task":"What does add(2,3)…"}</text>

  <!-- codex answer -->
  <text x="24" y="146" fill="#a6e3a1" font-size="15">⟦roundtable:codex⟧</text>
  <text x="24" y="170" fill="#cdd6f4" font-size="15">5</text>
  <text x="24" y="194" fill="#a6e3a1" font-size="15">⟦/roundtable⟧</text>

  <!-- you 2 -->
  <text x="24" y="238" fill="#cdd6f4" font-size="15">
    <tspan x="24" dy="0" fill="#89b4fa">you&gt;</tspan>
    <tspan xml:space="preserve"> @gemini check what codex did — was the task done right?</tspan>
  </text>
  <text x="24" y="264" fill="#6c7086" font-size="14">⚙ roundtable rt.check {"supervisor":"gemini","worker":"codex"}</text>

  <!-- gemini supervision verdict -->
  <text x="24" y="304" fill="#f9e2af" font-size="15">⟦roundtable:gemini⟧</text>
  <text x="24" y="330" fill="#cdd6f4" font-size="15">
    <tspan x="24" dy="0">VERDICT: ON-SPEC</tspan>
    <tspan x="24" dy="24">FINDINGS:</tspan>
    <tspan x="24" dy="24">1. Value 5 is correct for add(2,3) in calc.ts</tspan>
    <tspan x="24" dy="24">2. No other files were touched</tspan>
  </text>
  <text x="24" y="436" fill="#f9e2af" font-size="15">⟦/roundtable⟧</text>

  <!-- cursor -->
  <text x="24" y="466" fill="#cdd6f4" font-size="15">▊</text>
</svg>
